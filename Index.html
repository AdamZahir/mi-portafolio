
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portafolio | Zahira García</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #eef7ff;
}

.portafolio {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0;
    margin: 0;
    padding: 0;
}

.portafolio img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: none;
}

/* DIAPOSITIVAS CON VIDEO */

.slide-video {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 0;
}

.slide-video .fondo {
    width: 100%;
    height: auto;
    display: block;
}

.slide-video video {
    position: absolute;
    display: block;
    object-fit: contain;
    background: #111;
    border: none;
}

/* VIDEO DE LA DIAPOSITIVA 8 */

.video-08 {
    top: 5%;
    left: 5%;
    width: 90%;
    height: 90%;
}

/* VIDEO DE LA DIAPOSITIVA 9 */

.video-09 {
    top: 24%;
    left: 5%;
    width: 90%;
    height: 70%;
}

/* ADAPTACIÓN A CELULARES */

@media (max-width: 600px) {
    .slide-video video {
        object-fit: contain;
    }
}
</style>
</head>

<body>

<main class="portafolio">

    <!-- PORTADA -->
    <img src="img/Potada.png" alt="Portafolio de Zahira García">

    <!-- DIAPOSITIVAS 1 A 7 -->
    <img src="img/img 1.png" alt="Diapositiva 1">
    <img src="img/img 2.png" alt="Diapositiva 2">
    <img src="img/img 3.png" alt="Diapositiva 3">
    <img src="img/img%204.png" alt="Diapositiva 4">
    <img src="img/img%205.png" alt="Diapositiva 5">
    <img src="img/img%206.png" alt="Diapositiva 6">
    <img src="img/img%207.png" alt="Diapositiva 7">


    <!-- DIAPOSITIVA 8 + VIDEO -->
    <section class="slide-video">

        <img
            class="fondo"
            src="img/img%208%20%28Video%29.png"
            alt="Diapositiva 8"
        >

        <video class="video-08" controls playsinline preload="metadata">
            <source src="img/video-08.mp4" type="video/mp4">
            Tu navegador no admite este video.
        </video>

    </section>


    <!-- DIAPOSITIVA 9 + VIDEO -->
    <section class="slide-video">

        <img
            class="fondo"
            src="img/img%209.png"
            alt="Sketch animatic"
        >

        <video class="video-09" controls playsinline preload="metadata">
            <source src="img/video-09.mp4" type="video/mp4">
            Tu navegador no admite este video.
        </video>

    </section>


    <!-- DIAPOSITIVAS 10 A 16 -->
    <img src="img/img%2010.png" alt="Diapositiva 10">
    <img src="img/img%2011.png" alt="Diapositiva 11">
    <img src="img/img%2012.png" alt="Diapositiva 12">
    <img src="img/img%2013.png" alt="Diapositiva 13">
    <img src="img/img%2014.png" alt="Diapositiva 14">
    <img src="img/img%2015.png" alt="Diapositiva 15">
    <img src="img/img%2016.png" alt="Diapositiva 16">

</main>

</body>
</html>
