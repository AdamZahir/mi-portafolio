
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portafolio | Zahira García</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #252936;
}

/* CONTENEDOR CENTRAL ---------------------------------- */
.portafolio {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: #eef7ff;
}

.portafolio img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: none;
}


/* DIAPOSITIVAS CON VIDEO */

.slide-video {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 0;
}

.slide-video .fondo {
    width: 100%;
    height: auto;
    display: block;
}

.slide-video video {
    position: absolute;
    display: block;
    object-fit: contain;
    background: #111;
    border: none;
}

/* VIDEO DE LA DIAPOSITIVA 8 */

.video-08 {
    top: 3%;
    left: 5%;
    width: 90%;
    height: 90%;
}

/* VIDEO DE LA DIAPOSITIVA 9 */

.video-09 {
    top: 24%;
    left: 5%;
    width: 90%;
    height: 70%;
}


/* FUENTE POPPINS -------------------------------------------------  */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

/* ENLACE DEBAJO DEL PRIMER VIDEO ! -------------------------------------------------------*/

.enlace-video08 {
    position: absolute;
    bottom: -2%;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #5170ff;
    text-decoration: none;
    cursor: pointer;
    line-height: 1.5;
    transition: opacity 0.3s ease;
}

.enlace-video08:hover {
    opacity: 0.7;
    text-decoration: underline;
}

/* PARA  CELULARES --------------------------------------- */

@media (max-width: 600px) {
    .slide-video video {
        object-fit: contain;
    }

    .enlace-video08 {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<main class="portafolio">

    <img src="img/Potada.png" alt="Portafolio de Zahira García">

    <img src="img/img 1.png" alt="Diapositiva 1">
    <img src="img/img 2.png" alt="Diapositiva 2">
    <img src="img/img 3.png" alt="Diapositiva 3">
    <img src="img/img 4.png" alt="Diapositiva 4">
    <img src="img/img 5.png" alt="Diapositiva 5">
    <img src="img/img 6.png" alt="Diapositiva 6">
    <img src="img/img 7.png" alt="Diapositiva 7">


    <!-- DIAPOSITIVA 8 Y SU  VIDEO -->
    <section class="slide-video">

        <img class="fondo" src="img/img 8 ( Video ).png" alt="Diapositiva 8"
        >

        <video class="video-08" controls playsinline preload="metadata">
            <source src="videos/ Desinvitada Animacionfinal.mp4" type="video/mp4">
            Tu navegador no admite este video.
        </video>


    <!-- DIAPOSITIVA 9 Y SU VIDEO -->
    <section class="slide-video">

        <img class="fondo" src="img/img 9.png" alt="Sketch animatic" >

        <video class="video-09" controls playsinline preload="metadata">
            <source src="videos/sketch_Fornite.mp4" type="video/mp4">
            Tu navegador no admite este video.
        </video>
    </section>
        
        <!-- HIPERVÍNCULO A YOUTUBE --------------------------------- -->
        <a
            class="enlace-video08" href="https://youtu.be/ZQCce7EVrVE?si=qRc_ZUDj50gxI0pW"
            target="_blank" rel="noopener noreferrer" >
            Mira el video completo aquí !!
        </a>
    </section>

    <img src="img/img 10.png" alt="Diapositiva 10">
    <img src="img/img 11.png" alt="Diapositiva 11">
    <img src="img/img 12.png" alt="Diapositiva 12">
    <img src="img/img 13.png" alt="Diapositiva 13">
    <img src="img/img 14.png" alt="Diapositiva 14">
    <img src="img/img 15.png" alt="Diapositiva 15">
    <img src="img/img 16.png" alt="Diapositiva 16">

</main>

</body>
</html>
