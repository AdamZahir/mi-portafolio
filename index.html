
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portafolio | Zahira García</title>

<style>

/* CONFIGURACIÓN GENERAL */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #252936;
}

/* CONTENEDOR CENTRAL */

.portafolio {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: #eef7ff;
}

.portafolio img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: none;
}


/* DIAPOSITIVAS CON VIDEO */

.slide-video {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 0;
}

.slide-video .fondo {
    width: 100%;
    height: auto;
    display: block;
}


/* CONFIGURACIÓN GENERAL DE LOS VIDEOS */

.slide-video video {
    position: absolute;
    display: block;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 70%;
    height: 65%;

    object-fit: contain;
    background: transparent;
    border: none;
}


/* VIDEO DE LA DIAPOSITIVA 8 */

.slide-08 video {
    top: 43%;
}


/* VIDEO DE LA DIAPOSITIVA 9 */

.slide-09 video {
    top: 50%;
}


/* FUENTE POPPINS */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');


/* ENLACE DEBAJO DEL VIDEO 9 */

.enlace-video09 {
    position: absolute;
    bottom: 3%;
    left: 0;
    width: 100%;

    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;

    color: #5170ff;
    text-decoration: none;
    cursor: pointer;

    line-height: 1.5;
    transition: opacity 0.3s ease;
}

.enlace-video09:hover {
    opacity: 0.7;
    text-decoration: underline;
}


/* PARA CELULARES */

@media (max-width: 600px) {

    .slide-video video {
        width: 78%;
        height: 65%;
    }

    .slide-08 video {
        top: 43%;
    }

    .slide-09 video {
        top: 50%;
    }

    .enlace-video09 {
        font-size: 11px;
    }

}

</style>
</head>

<body>

<main class="portafolio">

    <!-- PORTADA -->

    <img src="img/Potada.png" alt="Portafolio de Zahira García">

    <!-- DIAPOSITIVAS 1 A 7 -->

    <img src="img/img 1.png" alt="Diapositiva 1">
    <img src="img/img 2.png" alt="Diapositiva 2">
    <img src="img/img 3.png" alt="Diapositiva 3">
    <img src="img/img 4.png" alt="Diapositiva 4">
    <img src="img/img 5.png" alt="Diapositiva 5">
    <img src="img/img 6.png" alt="Diapositiva 6">
    <img src="img/img 7.png" alt="Diapositiva 7">


    <!-- DIAPOSITIVA 8 Y SU VIDEO -->

    <section class="slide-video slide-08">

        <img
            class="fondo"
            src="img/img 8 ( Video ).png"
            alt="Diapositiva 8"
        >

        <video controls playsinline preload="metadata">
            <source
                src="videos/Desinvitada Animacionfinal.mp4"
                type="video/mp4"
            >
            Tu navegador no admite este video.
        </video>

    </section>


    <!-- DIAPOSITIVA 9 Y SU VIDEO -->

    <section class="slide-video slide-09">

        <img
            class="fondo"
            src="img/img 9.png"
            alt="Diapositiva 9"
        >

        <video controls playsinline preload="metadata">
            <source
                src="videos/sketch_Fornite.mp4"
                type="video/mp4"
            >
            Tu navegador no admite este video.
        </video>

        <!-- ENLACE DE YOUTUBE DEBAJO DEL VIDEO 9 -->

        <a
            class="enlace-video09"
            href="https://youtu.be/ZQCce7EVrVE?si=qRc_ZUDj50gxI0pW"
            target="_blank"
            rel="noopener noreferrer"
        >
            Mira el video completo aquí !!
        </a>

    </section>


    <!-- DIAPOSITIVAS 10 A 16 -->

    <img src="img/img 10.png" alt="Diapositiva 10">
    <img src="img/img 11.png" alt="Diapositiva 11">
    <img src="img/img 12.png" alt="Diapositiva 12">
    <img src="img/img 13.png" alt="Diapositiva 13">
    <img src="img/img 14.png" alt="Diapositiva 14">
    <img src="img/img 15.png" alt="Diapositiva 15">
    <img src="img/img 16.png" alt="Diapositiva 16">

</main>

</body>
</html>
