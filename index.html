
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portafolio | Zahira García</title>

<!-- FUENTES E ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* CONFIGURACIÓN GENERAL */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #252936;
}

/* CONTENEDOR CENTRAL */

.portafolio {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: #eef7ff;
}

.portafolio img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: none;
}

/* DIAPOSITIVAS CON VIDEO */

.slide-video {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 0;
}

.slide-video .fondo {
    width: 100%;
    height: auto;
    display: block;
}

/* CONFIGURACIÓN GENERAL DE LOS VIDEOS */

.slide-video video {
    position: absolute;
    display: block;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 80%;
    height: 74%;

    object-fit: contain;
    background: transparent;
    border: none;
}

/* VIDEO DE LA DIAPOSITIVA 8 */

.slide-08 video {
    top: 33%;
}

/* VIDEO DE LA DIAPOSITIVA 9 */

.slide-09 video {
    top: 40%;
}

/* ENLACE DEBAJO DEL VIDEO 9 */

.enlace-video09 {
    position: absolute;
    bottom: 8%;
    left: 0;
    width: 100%;

    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-size: 30px;
    font-weight: 600;

    color: #5170ff;
    text-decoration: none;
    cursor: pointer;

    line-height: 1.5;
    transition: opacity 0.3s ease;
}

.enlace-video09:hover {
    opacity: 0.7;
    text-decoration: underline;
}

/* DIAPOSITIVA 18 CON AUDIOS */

.slide-18 {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 0;
}

.slide-18 .fondo {
    width: 100%;
    height: auto;
    display: block;
}

/* CONTENEDOR DE LOS DOS AUDIOS */

.audios-18 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 70%;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 35px;

    line-height: 1.5;
}

/* CADA REPRODUCTOR */

.audio-item {
    width: 100%;
    text-align: center;
    font-family: 'Poppins', sans-serif;
}

.audio-item h3 {
    color: #ffffff;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 12px;
}

.audio-item audio {
    display: block;
    width: 100%;
    height: 45px;
}

/* FOOTER */

.footer {
    width: 100%;
    background: #252933;
    color: white;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    padding: 45px 20px;
}

.footer h2 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 10px;
}

.footer p {
    font-size: 14px;
    margin: 0 0 25px;
    color: #e0e3f0;
}

.footer-redes {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 25px;
    margin-bottom: 30px;
}

.footer-redes a {
    color: white;
    font-size: 25px;
    text-decoration: none;
    transition: 0.3s ease;
}

.footer-redes a:hover {
    color: #aab7ff;
    transform: translateY(-5px);
}

.footer-copy {
    border-top: 1px solid rgba(255,255,255,0.25);
    padding-top: 20px;
    font-size: 12px;
    color: #c9cde0;
}

/* PARA CELULARES */

@media (max-width: 600px) {

    .slide-video video {
        width: 82%;
        height: 70%;
    }

    .slide-08 video {
        top: 43%;
    }

    .slide-09 video {
        top: 50%;
    }

    .enlace-video09 {
        font-size: 11px;
    }

    /* AUDIOS EN CELULARES */

    .audios-18 {
        width: 75%;
        gap: 10px;
    }

    .audio-item h3 {
        font-size: 10px;
        margin-bottom: 3px;
    }

    .audio-item audio {
        height: 28px;
    }

    /* FOOTER EN CELULARES */

    .footer {
        padding: 35px 15px;
    }

    .footer h2 {
        font-size: 21px;
    }

    .footer p {
        font-size: 12px;
    }

    .footer-redes {
        gap: 22px;
    }

    .footer-redes a {
        font-size: 22px;
    }

}

</style>
</head>
